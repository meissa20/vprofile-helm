apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: vprofile
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/meissa20/vprofile-helm.git
    targetRevision: HEAD
    path: chart
    helm:
      releaseName: vprofile
      valueFiles:
        - values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: vprofile

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true