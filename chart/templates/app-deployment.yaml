apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vprofile.componentName" (dict "root" . "component" "app") }}
spec:
  replicas: {{ .Values.application.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: app
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: app
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: vproapp
          image: "{{ .Values.application.image.repository }}:{{ .Values.application.image.tag }}"
          imagePullPolicy: {{ .Values.application.image.pullPolicy }}
          ports:
            - containerPort: 8080
              name: http
          resources:
            {{- toYaml .Values.application.resources | nindent 12 }}
      initContainers:
        - name: wait-for-db
          image: "{{ .Values.application.initImage }}"
          command: ['sh', '-c', "until nslookup {{ include "vprofile.componentName" (dict "root" . "component" "db") }}; do echo waiting for database; sleep 2; done"]
        - name: wait-for-cache
          image: "{{ .Values.application.initImage }}"
          command: ['sh', '-c', "until nslookup {{ include "vprofile.componentName" (dict "root" . "component" "cache") }}; do echo waiting for cache; sleep 2; done"]
        - name: wait-for-rabbitmq
          image: "{{ .Values.application.initImage }}"
          command: ['sh', '-c', "until nslookup {{ include "vprofile.componentName" (dict "root" . "component" "rabbitmq") }}; do echo waiting for rabbitmq; sleep 2; done"]
