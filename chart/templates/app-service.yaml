apiVersion: v1
kind: Service
metadata:
  name: {{ include "vprofile.componentName" (dict "root" . "component" "app") }}
spec:
  type: {{ .Values.application.service.type }}
  selector:
    app.kubernetes.io/component: app
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.application.service.port }}
      targetPort: 8080
