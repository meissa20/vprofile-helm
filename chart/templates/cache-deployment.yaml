apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vprofile.componentName" (dict "root" . "component" "cache") }}
spec:
  replicas: {{ .Values.cache.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: cache
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: cache
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: memcached
          image: "{{ .Values.cache.image.repository }}:{{ .Values.cache.image.tag }}"
          imagePullPolicy: {{ .Values.cache.image.pullPolicy }}
          ports:
            - containerPort: 11211
              name: memcached
          resources:
            {{- toYaml .Values.cache.resources | nindent 12 }}
