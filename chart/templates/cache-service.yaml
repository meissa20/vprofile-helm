apiVersion: v1
kind: Service
metadata:
  name: {{ include "vprofile.componentName" (dict "root" . "component" "cache") }}
spec:
  type: {{ .Values.cache.service.type }}
  selector:
    app.kubernetes.io/component: cache
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: memcached
      protocol: TCP
      port: {{ .Values.cache.service.port }}
      targetPort: 11211
