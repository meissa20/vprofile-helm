apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "vprofile.componentName" (dict "root" . "component" "db") }}
  labels:
    {{- include "vprofile.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.database.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/component: db
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/component: db
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      containers:
        - name: db
          image: "{{ .Values.database.image.repository }}:{{ .Values.database.image.tag }}"
          imagePullPolicy: {{ .Values.database.image.pullPolicy }}
          ports:
            - containerPort: 3306
              name: mysql
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "vprofile.componentName" (dict "root" . "component" "secret") }}
                  key: db-pass
          resources:
            {{- toYaml .Values.database.resources | nindent 12 }}
          volumeMounts:
            - name: db-storage
              mountPath: /var/lib/mysql
      initContainers:
        - name: prepare-mysql
          image: "{{ .Values.database.initImage }}"
          resources:
            {{- toYaml .Values.database.initResources | nindent 12 }}
          command:
            - sh
            - -c
            - |
              if [ -d /var/lib/mysql/lost+found ]; then rm -rf /var/lib/mysql/lost+found; fi
          volumeMounts:
            - mountPath: /var/lib/mysql
              name: db-storage
      volumes:
        - name: db-storage
          persistentVolumeClaim:
            claimName: {{ include "vprofile.componentName" (dict "root" . "component" "db-pvc") }}
