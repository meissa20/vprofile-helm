apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "vprofile.componentName" (dict "root" . "component" "db-pvc") }}
  labels:
    {{- include "vprofile.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.database.persistence.accessMode }}
  resources:
    requests:
      storage: {{ .Values.database.persistence.size }}
  {{- if .Values.database.storageClass.create }}
  storageClassName: {{ include "vprofile.componentName" (dict "root" . "component" "ebs") }}
  {{- else if .Values.database.persistence.storageClassName }}
  storageClassName: {{ .Values.database.persistence.storageClassName }}
  {{- end }}
