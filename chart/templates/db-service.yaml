apiVersion: v1
kind: Service
metadata:
  name: {{ include "vprofile.componentName" (dict "root" . "component" "db") }}
spec:
  type: {{ .Values.database.service.type }}
  selector:
    app.kubernetes.io/component: db
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: mysql
      protocol: TCP
      port: {{ .Values.database.service.port }}
      targetPort: 3306
