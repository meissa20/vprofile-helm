apiVersion: v1
kind: Service
metadata:
  name: {{ include "vprofile.componentName" (dict "root" . "component" "rabbitmq") }}
spec:
  type: {{ .Values.rabbitmq.service.type }}
  selector:
    app.kubernetes.io/component: rabbitmq
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: amqp
      protocol: TCP
      port: {{ .Values.rabbitmq.service.port }}
      targetPort: 5672
